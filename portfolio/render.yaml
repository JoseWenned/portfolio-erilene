services:
  - type: web
    name: portfolio-erline
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-erline-db
          property: connectionString
      - key: PORTFOLIO_SECURITY_ADMIN_EMAIL
        sync: false
      - key: PORTFOLIO_SECURITY_ADMIN_PASSWORD
        sync: false

databases:
  - name: portfolio-erline-db
    plan: free